name: Analyze Weight Logs

on:
  push:
    paths:
      - 'logs/**.json'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run weight analysis
        run: node .github/scripts/analyze.js

      - name: Commit summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "NeverLifts Bot"
          git config user.email "bot@neverlifts.app"
          git add logs/summary.json
          git diff --staged --quiet || git commit -m "📊 update weight summary"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/seanstep88/daily-sheve-lifts.git
