<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Pig Pink Shading -->
    <linearGradient id="pigBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="pigSnout" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <linearGradient id="innerEar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Headband / Sweatband Gradient -->
    <linearGradient id="headband" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Dumbbell Chrome/Steel Gradient -->
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="weightPlates" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f472b6" flood-opacity="0.3"/>
    </filter>
    <filter id="sweatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="rgba(244,114,182,0.25)" stroke-width="4"/>

  <!-- Character Group -->
  <g filter="url(#glow)">

    <!-- Ears -->
    <!-- Left Ear -->
    <path d="M 140 180 C 110 110, 160 80, 200 130 Z" fill="url(#pigBody)" />
    <path d="M 148 170 C 128 120, 165 100, 192 138 Z" fill="url(#innerEar)" opacity="0.8" />
    <!-- Right Ear -->
    <path d="M 372 180 C 402 110, 352 80, 312 130 Z" fill="url(#pigBody)" />
    <path d="M 364 170 C 384 120, 347 100, 320 138 Z" fill="url(#innerEar)" opacity="0.8" />

    <!-- Pig Head -->
    <ellipse cx="256" cy="225" rx="130" ry="115" fill="url(#pigBody)" />

    <!-- Gym Sweatband / Headband -->
    <path d="M 134 185 C 180 160, 332 160, 378 185 L 372 215 C 330 190, 182 190, 140 215 Z" fill="url(#headband)" />
    <!-- Headband Stripe -->
    <path d="M 137 197 C 180 174, 332 174, 375 197" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.7" />

    <!-- Cute Big Eyes -->
    <!-- Left Eye -->
    <ellipse cx="205" cy="225" rx="16" ry="20" fill="#0f172a" />
    <circle cx="199" cy="218" r="7" fill="#ffffff" />
    <circle cx="212" cy="232" r="3" fill="#ffffff" />
    <!-- Right Eye -->
    <ellipse cx="307" cy="225" rx="16" ry="20" fill="#0f172a" />
    <circle cx="301" cy="218" r="7" fill="#ffffff" />
    <circle cx="314" cy="232" r="3" fill="#ffffff" />

    <!-- Rosy Cheeks (Blush) -->
    <ellipse cx="160" cy="255" rx="20" ry="12" fill="#fb7185" opacity="0.6" />
    <ellipse cx="352" cy="255" rx="20" ry="12" fill="#fb7185" opacity="0.6" />

    <!-- Cute Piggy Snout -->
    <ellipse cx="256" cy="265" rx="42" ry="30" fill="url(#pigSnout)" stroke="#f472b6" stroke-width="3" />
    <!-- Nostrils -->
    <ellipse cx="242" cy="265" rx="8" ry="12" fill="#831843" />
    <ellipse cx="270" cy="265" rx="8" ry="12" fill="#831843" />

    <!-- Happy Smile under snout -->
    <path d="M 240 298 Q 256 312 272 298" stroke="#be185d" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Cute Sweat Drop (Effort!) -->
    <path d="M 365 145 C 365 135, 380 120, 380 120 C 380 120, 395 135, 395 145 C 395 155, 382 160, 365 145 Z" fill="#38bdf8" filter="url(#sweatGlow)" opacity="0.9" />

    <!-- Pig Paws / Hands holding the dumbbell -->
    <!-- Left Paw -->
    <ellipse cx="175" cy="365" rx="22" ry="18" fill="url(#pigBody)" />
    <!-- Right Paw -->
    <ellipse cx="337" cy="365" rx="22" ry="18" fill="url(#pigBody)" />

  </g>

  <!-- Big Heavy Dumbbell -->
  <!-- Dumbbell Steel Handle Bar -->
  <rect x="100" y="358" width="312" height="18" rx="9" fill="url(#steel)" stroke="#334155" stroke-width="2" />
  
  <!-- Left Weight Plates -->
  <!-- Outer Plate -->
  <rect x="68" y="305" width="22" height="124" rx="8" fill="url(#weightPlates)" stroke="#475569" stroke-width="3" />
  <!-- Inner Plate -->
  <rect x="94" y="318" width="22" height="98" rx="7" fill="url(#weightPlates)" stroke="#475569" stroke-width="3" />
  <!-- Left Collar / Lock -->
  <rect x="118" y="350" width="14" height="34" rx="4" fill="url(#steel)" />

  <!-- Right Weight Plates -->
  <!-- Right Collar / Lock -->
  <rect x="380" y="350" width="14" height="34" rx="4" fill="url(#steel)" />
  <!-- Inner Plate -->
  <rect x="396" y="318" width="22" height="98" rx="7" fill="url(#weightPlates)" stroke="#475569" stroke-width="3" />
  <!-- Outer Plate -->
  <rect x="422" y="305" width="22" height="124" rx="8" fill="url(#weightPlates)" stroke="#475569" stroke-width="3" />

  <!-- Dumbbell Plate Highlights -->
  <rect x="73" y="315" width="4" height="104" rx="2" fill="#94a3b8" opacity="0.4" />
  <rect x="99" y="328" width="4" height="78" rx="2" fill="#94a3b8" opacity="0.4" />
  <rect x="401" y="328" width="4" height="78" rx="2" fill="#94a3b8" opacity="0.4" />
  <rect x="427" y="315" width="4" height="104" rx="2" fill="#94a3b8" opacity="0.4" />

  <!-- Cute Paws overlapping the bar -->
  <ellipse cx="180" cy="362" rx="20" ry="15" fill="url(#pigBody)" />
  <ellipse cx="332" cy="362" rx="20" ry="15" fill="url(#pigBody)" />
</svg>
